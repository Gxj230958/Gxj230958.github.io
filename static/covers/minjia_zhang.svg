<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">CPU Adam worker overlap</title>
  <desc id="desc">Illustrative schedules for two independent CPU Adam workers. Holding the GIL serializes the updates. Releasing it allows them to overlap. The measured median training step speedup on Qwen3-0.6B is 1.151×.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#686158" stroke-width="1.2" />
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fffdf8" />
  <g font-family="Arial, sans-serif" fill="#28241f">
    <text x="30" y="39" font-size="23" font-weight="600" font-family="Arial, sans-serif" fill="#28241f">CPU Adam worker overlap</text>
    <path d="M30 57H570 M30 326H570" stroke="#cfc6b9" stroke-width="2" />
    <g font-size="18" font-weight="600">
      <text x="30" y="105" font-family="Arial, sans-serif" fill="#28241f" font-size="18" font-weight="600">GIL held</text>
      <text x="315" y="105" font-family="Arial, sans-serif" fill="#28241f" font-size="18" font-weight="600">GIL released</text>
    </g>
    <path d="M30 195H280 M315 195H565" stroke="#ece7df" stroke-width="1.5" />
    <g fill="#a33c25">
      <rect x="30" y="135" width="120" height="47" rx="5" />
      <rect x="315" y="135" width="120" height="47" rx="5" />
    </g>
    <g fill="#97610c">
      <rect x="160" y="208" width="120" height="47" rx="5" />
      <rect x="362" y="208" width="120" height="47" rx="5" />
    </g>
    <g fill="white" font-size="18" text-anchor="middle">
      <text x="90" y="165" font-family="Arial, sans-serif" fill="white" font-size="18" text-anchor="middle">Worker A</text>
      <text x="375" y="165" font-family="Arial, sans-serif" fill="white" font-size="18" text-anchor="middle">Worker A</text>
      <text x="220" y="238" font-family="Arial, sans-serif" fill="white" font-size="18" text-anchor="middle">Worker B</text>
      <text x="422" y="238" font-family="Arial, sans-serif" fill="white" font-size="18" text-anchor="middle">Worker B</text>
    </g>
    <g fill="none" stroke="#686158" stroke-width="1.8" marker-end="url(#arrow)">
      <path d="M30 275H279" />
      <path d="M315 275H564" />
    </g>
    <text x="300" y="304" fill="#686158" font-size="15" text-anchor="middle" font-family="Arial, sans-serif">Illustrative worker schedule</text>
    <text x="30" y="356" fill="#a33c25" font-size="21" font-weight="600" font-family="Arial, sans-serif">1.151× median training step speedup</text>
    <text x="30" y="381" fill="#686158" font-size="15" font-family="Arial, sans-serif">Qwen3-0.6B on Ascend 910B · three paired seeds</text>
  </g>
</svg>
