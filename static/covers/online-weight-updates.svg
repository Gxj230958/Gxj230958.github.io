<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Rank-local policy updates</title>
  <desc id="desc">Two example trainer matrices are split by rows and by columns. Independent HCCL transfers deliver the blue shards to rollout rank 0 and the amber shards to rank 1. Full-checkpoint broadcast carries 14.19 GiB per rank and rank-local updates carry 7.19 GiB. On Qwen2.5-7B the median update pause fell from 668 to 516 milliseconds.</desc>
  <defs>
    <g id="grid" stroke="#f9fbfc" stroke-width="1.4" fill="none">
      <path d="M16 0v64 M32 0v64 M48 0v64 M0 16h64 M0 32h64 M0 48h64"/>
    </g>
    <rect id="guide" width="64" height="64" rx="1" fill="#edf1f3"/>
    <g id="rows"><use href="#guide"/><path d="M0 0h64v32H0z" fill="#467eac"/><path d="M0 32h64v32H0z" fill="#cc8b3d"/><use href="#grid"/></g>
    <g id="columns"><use href="#guide"/><path d="M0 0h32v64H0z" fill="#467eac"/><path d="M32 0h32v64H32z" fill="#cc8b3d"/><use href="#grid"/></g>
    <g id="rows0"><use href="#guide"/><path d="M0 0h64v32H0z" fill="#467eac"/><use href="#grid"/></g>
    <g id="cols0"><use href="#guide"/><path d="M0 0h32v64H0z" fill="#467eac"/><use href="#grid"/></g>
    <g id="rows1"><use href="#guide"/><path d="M0 32h64v32H0z" fill="#cc8b3d"/><use href="#grid"/></g>
    <g id="cols1"><use href="#guide"/><path d="M32 0h32v64H32z" fill="#cc8b3d"/><use href="#grid"/></g>
  </defs>
  <rect width="600" height="400" fill="#f9fbfc"/>
  <g font-family="Arial, sans-serif" fill="#16364c">
    <text x="30" y="39" font-size="23" font-weight="600">Rank-local policy updates</text>
    <path d="M30 57H570 M30 326H570" fill="none" stroke="#dce5eb" stroke-width="2"/>

    <g font-size="18" font-weight="600">
      <text x="30" y="96">Trainer</text>
      <text x="377" y="96">Rollout workers</text>
    </g>
    <rect x="30" y="111" width="202" height="153" rx="7" fill="#edf3f6" stroke="#cad8e1"/>
    <use href="#rows" transform="translate(47 142) scale(1.08)"/>
    <use href="#columns" transform="translate(145 142) scale(1.08)"/>
    <g text-anchor="middle" font-size="16">
      <text x="81.5" y="241">Rows</text>
      <text x="179.5" y="241">Columns</text>
    </g>

    <path d="M232 160h21c17 0 18-13 36-13h77" stroke="#467eac" stroke-width="3" fill="none"/>
    <path d="M232 216h21c17 0 18 13 36 13h77" stroke="#ac712d" stroke-width="3" fill="none"/>
    <path d="m364 141 11 6-11 6z" fill="#467eac"/>
    <path d="m364 223 11 6-11 6z" fill="#ac712d"/>
    <g text-anchor="middle" fill="#425969" font-size="16">
      <text x="302" y="184">Parallel</text>
      <text x="302" y="203">HCCL</text>
    </g>

    <rect x="377" y="111" width="193" height="71" rx="7" fill="#fff" stroke="#c6d8e5" stroke-width="1.5"/>
    <rect x="377" y="194" width="193" height="70" rx="7" fill="#fff" stroke="#e3d2b9" stroke-width="1.5"/>
    <g font-size="16" font-weight="600">
      <text x="389" y="152" fill="#345f84">Rank 0</text>
      <text x="389" y="235" fill="#88591e">Rank 1</text>
    </g>
    <use href="#rows0" transform="translate(466 125) scale(.68)"/>
    <use href="#cols0" transform="translate(516 125) scale(.68)"/>
    <use href="#rows1" transform="translate(466 207) scale(.68)"/>
    <use href="#cols1" transform="translate(516 207) scale(.68)"/>
    <g font-size="16" text-anchor="middle" fill="#425969">
      <text x="131" y="294">14.19 GiB checkpoint</text>
      <text x="473.5" y="294">7.19 GiB per rank</text>
    </g>
    <text x="30" y="356" font-size="20" font-weight="600" fill="#247a73">22.8% shorter update pauses</text>
    <text x="30" y="381" font-size="15" fill="#536b79">668 → 516 ms · Qwen2.5-7B on three Ascend 910B2C NPUs</text>
  </g>
</svg>
