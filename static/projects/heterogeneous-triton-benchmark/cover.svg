<svg xmlns="http://www.w3.org/2000/svg" width="600px" height="400px" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Porting a GPU Triton kernel to Ascend 910B</title>
  <desc id="desc">A gated activation uses the Vector unit and a software conversion to produce FP8 storage. A separate Cube unit handles supported matrix arithmetic.</desc>
  <defs>
    <pattern id="matrix" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="9" height="9" rx="1" fill="#716858"/></pattern>
    <pattern id="tile" width="19" height="19" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="15" height="15" rx="2" fill="#bcb2a3"/></pattern>
  </defs>
  <rect width="600" height="400" fill="#fcfaf5"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#302c27">
    <text x="38" y="57" font-size="33" font-weight="700">GPU Triton</text>
    <text x="298" y="57" font-size="33" font-weight="700">Ascend 910B</text>
    <path d="M38 76H238 M298 76H561" stroke="#cdc2b0" stroke-width="2"/>
    <g id="gpu-kernel">
      <rect x="38" y="107" width="181" height="190" rx="9" fill="#f1ede4" stroke="#827766" stroke-width="2.5"/>
      <rect x="71" y="135" width="115" height="96" fill="url(#tile)"/>
      <path d="M74 197h110" stroke="#aa4d2b" stroke-width="13" stroke-dasharray="15 4"/>
      <text x="128" y="270" text-anchor="middle" font-size="28" font-weight="700">SiLU × up</text>
    </g>
    <g id="cube-unit">
      <rect x="298" y="99" width="263" height="76" rx="8" fill="#f1ede4" stroke="#a99e89" stroke-width="2"/>
      <rect x="318" y="116" width="47" height="44" fill="url(#matrix)"/>
      <text x="388" y="147" font-size="32" font-weight="700">Cube</text>
    </g>
    <g id="vector-unit">
      <rect x="298" y="191" width="263" height="88" rx="8" fill="#f6e0cb" stroke="#a44927" stroke-width="3"/>
      <path d="M319 215h44m-44 13h44m-44 13h44m-44 13h44" stroke="#a44927" stroke-width="6" stroke-linecap="round"/>
      <text x="388" y="229" font-size="32" font-weight="700">Vector</text>
      <text x="388" y="260" font-size="24">Software cast</text>
    </g>
    <g id="port-and-store" fill="#a44927">
      <path d="M220 235h63" fill="none" stroke="#a44927" stroke-width="5"/>
      <path d="m283 227 13 8-13 8z"/>
      <path d="M429 281v28" fill="none" stroke="#a44927" stroke-width="5"/>
      <path d="m421 307 8 12 8-12z"/>
    </g>
    <g id="fp8-storage">
      <rect x="298" y="321" width="263" height="54" rx="6" fill="#f0d49d" stroke="#b39863" stroke-width="2"/>
      <path d="M321 336h31v7h-31zm0 11h31v7h-31z" fill="#79613c"/>
      <text x="365" y="358" font-size="27" font-weight="700">FP8 storage</text>
    </g>
  </g>
</svg>
